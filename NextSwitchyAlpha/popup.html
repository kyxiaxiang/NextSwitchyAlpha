<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NextSwitchyAlpha</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div id="app">

  <!-- ====== Header ====== -->
  <header class="header">
    <div class="header-brand">
      <img src="images/icon.svg" class="brand-icon" alt="">
      <span class="brand-name">NextSwitchy</span>
    </div>
    <div class="header-status">
      <div class="status-pill" id="status-pill">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-label">Loading...</span>
      </div>
    </div>
    <div class="header-end">
      <button class="icon-btn" id="theme-btn" title="Toggle theme">A</button>
      <button class="icon-btn" id="lang-btn" title="Language" style="font-size:11px;font-weight:700">EN</button>
    </div>
  </header>

  <!-- ====== Tabs ====== -->
  <nav class="tabs">
    <button class="tab active" data-tab="proxy">
      <span class="tab-label" data-i18n="tab_proxy">代理</span>
    </button>
    <button class="tab" data-tab="headers">
      <span class="tab-label" data-i18n="tab_headers">请求头</span>
    </button>
    <button class="tab" data-tab="rules">
      <span class="tab-label" data-i18n="tab_rules">规则</span>
    </button>
    <button class="tab" data-tab="settings">
      <span class="tab-label" data-i18n="tab_settings">设置</span>
    </button>
  </nav>

  <!-- ====== Content ====== -->
  <main class="content">

    <!-- ====== Proxy Panel ====== -->
    <div class="panel active" id="panel-proxy">
      <div class="proxy-list" id="proxy-list">
        <div class="empty-state">Loading...</div>
      </div>

      <div class="sep mt-2 mb-2"></div>

      <!-- Add/Edit form -->
      <div id="proxy-form-wrap" style="display:none">
        <div class="card" style="padding:12px">
          <div class="form-label mb-1" id="proxy-form-title">添加代理</div>
          <div class="form-row">
            <input type="text" id="pf-name" data-i18n-ph="proxy_name" placeholder="代理名称" style="flex:1">
            <select id="pf-type" style="width:100px">
              <option value="http">HTTP</option>
              <option value="https">HTTPS</option>
              <option value="socks4">SOCKS4</option>
              <option value="socks5">SOCKS5</option>
              <option value="pac_url">PAC URL</option>
              <option value="pac_script">PAC Script</option>
            </select>
          </div>

          <div class="pf-server-fields">
            <div class="form-row">
              <input type="text" id="pf-host" data-i18n-ph="proxy_host" placeholder="主机地址" style="flex:1">
              <input type="text" id="pf-port" data-i18n-ph="proxy_port" placeholder="端口" style="width:72px">
            </div>
            <div class="form-row">
              <input type="text" id="pf-user" data-i18n-ph="proxy_user" placeholder="用户名（可选）" style="flex:1">
              <input type="password" id="pf-pass" data-i18n-ph="proxy_pass" placeholder="密码（可选）" style="flex:1">
            </div>
            <div class="form-row">
              <textarea id="pf-bypass" data-i18n-ph="proxy_bypass" placeholder="不代理的地址，每行一个&#10;例: *.local, 127.0.0.1" style="width:100%;height:56px"></textarea>
            </div>
          </div>

          <div class="pf-pac-url-field">
            <div class="form-row">
              <input type="url" id="pf-pac-url" data-i18n-ph="pac_url" placeholder="PAC URL" style="flex:1">
            </div>
          </div>

          <div class="pf-pac-script-field">
            <div class="form-row">
              <textarea id="pf-pac-script" placeholder="function FindProxyForURL(url, host) { ... }" style="width:100%;height:80px;font-family:monospace;font-size:11px"></textarea>
            </div>
          </div>

          <!-- Color picker -->
          <div class="form-label mb-1" data-i18n="proxy_color">标签颜色</div>
          <div class="color-row mb-2">
            <div class="color-opt selected" data-color="#6366f1" style="background:#6366f1"></div>
            <div class="color-opt" data-color="#10b981" style="background:#10b981"></div>
            <div class="color-opt" data-color="#f59e0b" style="background:#f59e0b"></div>
            <div class="color-opt" data-color="#ef4444" style="background:#ef4444"></div>
            <div class="color-opt" data-color="#3b82f6" style="background:#3b82f6"></div>
            <div class="color-opt" data-color="#8b5cf6" style="background:#8b5cf6"></div>
            <div class="color-opt" data-color="#ec4899" style="background:#ec4899"></div>
            <div class="color-opt" data-color="#14b8a6" style="background:#14b8a6"></div>
          </div>

          <div class="btn-row">
            <button class="btn btn-ghost btn-sm" id="pf-cancel" data-i18n="cancel">取消</button>
            <button class="btn btn-primary btn-sm" id="pf-save" data-i18n="save">保存</button>
          </div>
        </div>
      </div>

      <button class="btn btn-ghost btn-sm btn-full mt-1" id="btn-add-proxy" data-i18n="add_proxy">+ 添加代理</button>
    </div>

    <!-- ====== Headers Panel ====== -->
    <div class="panel" id="panel-headers">

      <!-- XFF Section -->
      <div class="card mb-2" id="xff-card">
        <div class="section-head" id="xff-head">
          <div class="section-head-left">
            <label class="toggle" onclick="event.stopPropagation()">
              <input type="checkbox" id="xff-enabled">
              <span class="toggle-track"></span>
            </label>
            <span class="section-title">IP 伪装 (XFF)</span>
          </div>
          <span class="section-arrow">▾</span>
        </div>
        <div class="section-body" id="xff-body">
          <div class="form-label mb-1" data-i18n="xff_headers">选择要注入的头</div>
          <div class="chip-grid" id="xff-chip-grid">
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="x-forwarded-for" checked><span class="chip-label">X-Forwarded-For</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="x-real-ip"><span class="chip-label">X-Real-IP</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="x-originating-ip"><span class="chip-label">X-Originating-IP</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="x-remote-ip"><span class="chip-label">X-Remote-IP</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="x-remote-addr"><span class="chip-label">X-Remote-Addr</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="x-forwarded"><span class="chip-label">X-Forwarded</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="x-cluster-client-ip"><span class="chip-label">X-Cluster-Client-IP</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="true-client-ip"><span class="chip-label">True-Client-IP</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="client-ip"><span class="chip-label">Client-IP</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="forwarded-for"><span class="chip-label">Forwarded-For</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="forwarded"><span class="chip-label">Forwarded</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="cf-connecting-ip"><span class="chip-label">CF-Connecting-IP</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="ali-cdn-real-ip"><span class="chip-label">Ali-CDN-Real-IP</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="cdn-src-ip"><span class="chip-label">CDN-SRC-IP</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="cdn-real-ip"><span class="chip-label">CDN-Real-IP</span></label>
            <label class="chip"><input class="chip-input xff-hdr-chip" type="checkbox" value="wl-proxy-client-ip"><span class="chip-label">WL-Proxy-Client-IP</span></label>
          </div>

          <div class="form-label mb-1 mt-2" data-i18n="xff_ip">IP 地址</div>
          <div class="form-row mb-2">
            <input type="text" id="xff-ip" data-i18n-ph="xff_ip_ph" placeholder="例: 1.2.3.4（留空=自动随机）" style="flex:1;font-family:monospace">
            <button class="btn btn-ghost btn-sm" id="xff-random" data-i18n="random_btn">随机</button>
          </div>

          <div class="form-label mb-1" data-i18n="url_filter">URL 过滤（留空 = 全部）</div>
          <div class="form-row mb-2">
            <input type="text" id="xff-url" data-i18n-ph="url_filter_ph" placeholder="例: *.example.com" style="flex:1;font-family:monospace">
          </div>

          <button class="btn btn-primary btn-sm" id="xff-save" data-i18n="save">保存</button>
        </div>
      </div>

      <!-- User-Agent Section -->
      <div class="card mb-2" id="ua-card">
        <div class="section-head" id="ua-head">
          <div class="section-head-left">
            <label class="toggle" onclick="event.stopPropagation()">
              <input type="checkbox" id="ua-enabled">
              <span class="toggle-track"></span>
            </label>
            <span class="section-title">User-Agent</span>
          </div>
          <span class="section-arrow">▾</span>
        </div>
        <div class="section-body" id="ua-body">
          <div class="form-label mb-1" data-i18n="ua_value">User-Agent 字符串</div>
          <div class="form-row mb-1">
            <input type="text" id="ua-value" data-i18n-ph="ua_ph" placeholder="输入 User-Agent 或选择预设" style="flex:1">
          </div>
          <div class="ua-presets mb-2">
            <button class="btn btn-ghost btn-sm" data-ua="mobile" data-i18n="ua_mobile">移动端</button>
            <button class="btn btn-ghost btn-sm" data-ua="desktop" data-i18n="ua_desktop">桌面端</button>
            <button class="btn btn-ghost btn-sm" data-ua="crawler" data-i18n="ua_crawler">爬虫</button>
            <button class="btn btn-ghost btn-sm" data-ua="random" data-i18n="ua_random">随机</button>
          </div>

          <div class="form-label mb-1" data-i18n="url_filter">URL 过滤（留空 = 全部）</div>
          <div class="form-row mb-2">
            <input type="text" id="ua-url" data-i18n-ph="url_filter_ph" placeholder="例: *.example.com" style="flex:1;font-family:monospace">
          </div>

          <button class="btn btn-primary btn-sm" id="ua-save" data-i18n="save">保存</button>
        </div>
      </div>

      <!-- Custom Headers Section -->
      <div class="card" id="custom-card">
        <div class="section-head" id="custom-head">
          <div class="section-head-left">
            <span class="section-title" data-i18n="custom_headers">自定义请求头 / 响应头</span>
          </div>
          <span class="section-arrow">▾</span>
        </div>
        <div class="section-body" id="custom-body">
          <div id="header-rules-list"></div>

          <!-- Add form -->
          <div class="add-hdr-form mt-1">
            <div class="form-label mb-1" data-i18n="add_header_rule">添加规则</div>
            <div class="add-hdr-row">
              <select id="new-hdr-scope" style="width:86px;font-size:12px">
                <option value="request" data-i18n="req_header">请求头</option>
                <option value="response" data-i18n="res_header">响应头</option>
              </select>
              <input type="text" id="new-hdr-name" data-i18n-ph="header_name" placeholder="Header 名称" style="flex:1;font-size:12px" list="hdr-suggestions">
              <datalist id="hdr-suggestions"></datalist>
            </div>
            <div class="add-hdr-row">
              <select id="new-hdr-op" style="width:86px;font-size:12px">
                <option value="set" data-i18n="op_set">设置</option>
                <option value="append" data-i18n="op_append">追加</option>
                <option value="remove" data-i18n="op_remove">删除</option>
              </select>
              <input type="text" id="new-hdr-value" data-i18n-ph="header_value" placeholder="值（删除时留空）" style="flex:1;font-size:12px">
            </div>
            <div class="add-hdr-row">
              <input type="text" id="new-hdr-url" data-i18n-ph="url_filter_ph" placeholder="URL 过滤（可选）" style="flex:1;font-size:12px;font-family:monospace">
              <button class="btn btn-primary btn-sm" id="add-hdr-btn" data-i18n="add">添加</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ====== Rules Panel ====== -->
    <div class="panel" id="panel-rules">
      <div class="rule-toolbar">
        <div class="rule-toggle-row">
          <label class="toggle">
            <input type="checkbox" id="auto-switch-toggle">
            <span class="toggle-track"></span>
          </label>
          <span data-i18n="auto_switch">自动切换代理</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="add-rule-btn" data-i18n="add_rule">+ 添加规则</button>
      </div>

      <div class="default-proxy-row">
        <span data-i18n="default_proxy">默认代理:</span>
        <select id="default-proxy-sel"></select>
      </div>

      <div class="test-url-bar">
        <input type="text" id="test-url-input" data-i18n-ph="test_url_ph" placeholder="测试 URL..." style="flex:1;font-size:12px">
        <button class="btn btn-ghost btn-sm" id="test-url-btn" data-i18n="test">测试</button>
      </div>
      <div class="test-url-result text-sm" id="test-url-result"></div>

      <div class="rule-list" id="rule-list"></div>

      <!-- Rule add form -->
      <div class="rule-add-form" id="rule-add-form" style="display:none">
        <div class="form-label mb-1" data-i18n="rule_pattern">URL 模式</div>
        <div class="form-row mb-2">
          <input type="text" id="rf-pattern" data-i18n-ph="rule_pattern_ph" placeholder="例: *.google.com" style="flex:1;font-family:monospace;font-size:12px">
          <select id="rf-type" style="width:90px;font-size:12px">
            <option value="wildcard" data-i18n="wildcard">通配符</option>
            <option value="regex" data-i18n="regex">正则</option>
          </select>
        </div>
        <div class="form-label mb-1" data-i18n="use_proxy">使用代理</div>
        <div class="form-row mb-2">
          <select id="rf-proxy" style="flex:1;font-size:12px"></select>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost btn-sm" id="rf-cancel" data-i18n="cancel">取消</button>
          <button class="btn btn-primary btn-sm" id="rf-save" data-i18n="save">保存</button>
        </div>
      </div>
    </div>

    <!-- ====== Settings Panel ====== -->
    <div class="panel" id="panel-settings">

      <div class="settings-group">
        <div class="settings-group-title" data-i18n="appearance">外观</div>
        <div class="settings-item">
          <span data-i18n="theme">主题</span>
          <div class="segment">
            <button class="seg-btn" data-theme-opt="light" data-i18n="theme_light">浅色</button>
            <button class="seg-btn active" data-theme-opt="auto" data-i18n="theme_auto">自动</button>
            <button class="seg-btn" data-theme-opt="dark" data-i18n="theme_dark">深色</button>
          </div>
        </div>
        <div class="settings-item">
          <span data-i18n="language">语言</span>
          <div class="segment">
            <button class="seg-btn active" data-lang="zh">中文</button>
            <button class="seg-btn" data-lang="en">English</button>
          </div>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-group-title" data-i18n="data_management">数据管理</div>
        <div class="settings-actions">
          <button class="btn btn-ghost btn-full" id="export-btn" data-i18n="export_config">导出配置</button>
          <button class="btn btn-ghost btn-full" id="import-btn" data-i18n="import_config">导入配置</button>
          <input type="file" id="import-file" accept=".json" style="display:none">
          <button class="btn btn-danger btn-full" id="reset-btn" data-i18n="reset_config">恢复默认设置</button>
        </div>
      </div>

      <div class="about-section">
        <div style="font-weight:700;font-size:13px;color:var(--c-primary);margin-bottom:4px">NextSwitchyAlpha v0.3.0</div>
        <div data-i18n="author_label">作者: 可以遐想 (keyixiaxiang)</div>
        <div style="margin-top:4px;font-size:11px;color:var(--c-text3)" data-i18n="tagline">超越 SwitchyOmega · ModHeader · XFF Header</div>
      </div>
    </div>

  </main>

  <!-- Toast -->
  <div id="toast"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
